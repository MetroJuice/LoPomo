<!DOCTYPE html>
<html class="dark" lang="ja"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>LofiPomo</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<!-- External CSS -->
<link href="style.css" rel="stylesheet"/>

<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#8b5cf6",
              "background-light": "#f6f7f8",
              "background-dark": "#18181b",
            },
            fontFamily: {
              "display": ["Manrope", "sans-serif"],
              "timer": ["Manrope", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
</head>
<body class="font-display bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100">

<!-- Main Container -->
<div class="relative flex h-dvh w-full flex-col overflow-hidden">

  <!-- Header -->
  <header class="flex items-center justify-between whitespace-nowrap px-6 py-4 z-10">
    <div class="flex items-center gap-3">
      <div class="size-6 text-primary">
        <svg fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2C6.486 2 2 6.486 2 12s4.486 10 10 10 10-4.486 10-10S17.514 2 12 2Zm0 18c-4.411 0-8-3.589-8-8s3.589-8 8-8 8 3.589 8 8-3.589 8-8 8Z"></path>
          <path d="M13 7h-2v5.414l3.293 3.293 1.414-1.414L13 11.586V7Z"></path>
        </svg>
      </div>
      <h2 class="text-lg font-bold tracking-tight">LofiPomo</h2>
    </div>
    <div class="flex items-center gap-2">
      <button id="fullscreen-btn" class="flex h-10 w-10 cursor-pointer items-center justify-center rounded-lg bg-slate-200/50 dark:bg-white/10 transition-colors hover:bg-slate-300/50 dark:hover:bg-white/20">
        <span id="fullscreen-icon" class="material-symbols-outlined text-2xl">fullscreen</span>
      </button>
      <button id="settings-btn" class="flex h-10 w-10 cursor-pointer items-center justify-center rounded-lg bg-slate-200/50 dark:bg-white/10 transition-colors hover:bg-slate-300/50 dark:hover:bg-white/20">
        <span class="material-symbols-outlined text-2xl">settings</span>
      </button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex flex-1 flex-col items-center justify-center text-center p-4">

    <!-- Timer Circle -->
    <div class="relative flex items-center justify-center w-72 h-72 sm:w-80 sm:h-80 md:w-96 md:h-96">
      <svg class="absolute inset-0 w-full h-full" viewBox="0 0 120 120">
        <circle class="text-slate-200/20 dark:text-slate-700/30" cx="60" cy="60" fill="transparent" r="54" stroke="currentColor" stroke-width="8"></circle>
        <circle id="progress-circle" class="-rotate-90 origin-center transform text-primary" cx="60" cy="60" fill="transparent" r="54" stroke="currentColor" stroke-dasharray="339.292" stroke-dashoffset="0" stroke-linecap="round" stroke-width="8"></circle>
      </svg>
      <div class="z-10 flex flex-col items-center justify-center">
        <p id="timer-display" class="font-timer text-6xl sm:text-7xl md:text-8xl font-light leading-none tabular-nums tracking-wide w-[300px] text-center">25:00</p>
      </div>
    </div>

    <!-- Controls -->
    <div class="mt-8 flex flex-col items-center gap-6">
      <div class="flex items-center gap-6">
        <button id="toggle-btn" class="flex h-20 w-20 items-center justify-center rounded-full bg-primary text-white shadow-xl shadow-primary/30 transition-transform active:scale-95 hover:scale-105">
          <span id="toggle-icon" class="material-symbols-outlined text-5xl">play_arrow</span>
        </button>
        <button id="skip-btn" class="flex h-14 w-14 items-center justify-center rounded-full bg-slate-200/50 dark:bg-white/10 text-slate-600 dark:text-slate-300 transition-colors hover:bg-slate-300/50 dark:hover:bg-white/20">
          <span class="material-symbols-outlined text-3xl">skip_next</span>
        </button>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="w-full self-center p-6 z-10">
    <div class="text-center">
      <p id="status-text" class="text-xl font-semibold">Focus Time</p>
      <p id="session-text" class="mt-1 text-sm font-medium text-slate-500 dark:text-slate-400">Session 1 of 4</p>
    </div>
  </footer>
</div>

<!-- Settings Overlay -->
<div id="settings-overlay" class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 opacity-0 pointer-events-none transition-opacity duration-300">
  <div class="bg-white dark:bg-[#1f1f23] w-full max-w-md rounded-2xl p-6 shadow-2xl m-4 transform scale-95 transition-transform duration-300" id="settings-modal">
    <div class="flex items-center justify-between mb-6">
      <h3 class="text-xl font-bold">Settings</h3>
      <button id="close-settings-btn" class="p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-white/5 transition-colors">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>

    <div class="space-y-6">
      <!-- Timer Settings -->
      <div class="space-y-4">
        <label class="block text-sm font-medium text-slate-500 dark:text-slate-400 uppercase tracking-wider">Timer (Minutes)</label>
        <div class="grid grid-cols-3 gap-4">
          <div class="space-y-2">
            <label class="text-xs font-medium">Focus</label>
            <input type="number" id="focus-time-input" value="25" min="1" max="60" class="w-full rounded-lg bg-slate-100 dark:bg-white/5 border-none text-center focus:ring-2 focus:ring-primary p-2">
          </div>
          <div class="space-y-2">
            <label class="text-xs font-medium">Short Break</label>
            <input type="number" id="short-break-input" value="5" min="1" max="30" class="w-full rounded-lg bg-slate-100 dark:bg-white/5 border-none text-center focus:ring-2 focus:ring-primary p-2">
          </div>
          <div class="space-y-2">
            <label class="text-xs font-medium">Long Break</label>
            <input type="number" id="long-break-input" value="15" min="1" max="60" class="w-full rounded-lg bg-slate-100 dark:bg-white/5 border-none text-center focus:ring-2 focus:ring-primary p-2">
          </div>
        </div>
      </div>

      <!-- Volume Settings -->
      <div class="space-y-4">
         <label class="block text-sm font-medium text-slate-500 dark:text-slate-400 uppercase tracking-wider">Volume</label>
         <div class="flex items-center gap-4">
           <span class="material-symbols-outlined text-slate-400">volume_down</span>
           <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="0.5" class="w-full h-2 bg-slate-200 dark:bg-white/10 rounded-lg appearance-none cursor-pointer [&::-webkit-slider-thumb]:appearance-none [&::-webkit-slider-thumb]:w-4 [&::-webkit-slider-thumb]:h-4 [&::-webkit-slider-thumb]:rounded-full [&::-webkit-slider-thumb]:bg-primary">
           <span class="material-symbols-outlined text-slate-400">volume_up</span>
         </div>
      </div>
    </div>
  </div>
</div>

<!-- External JS -->
<script src="script.js"></script>
</body></html>
