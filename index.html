<!DOCTYPE html>
<html class="dark" lang="ja"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>タイマー画面 (フォントとサイズ調整)</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght@300;400;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<style>
      .material-symbols-outlined {
        font-variation-settings:
        'FILL' 1,
        'wght' 400,
        'GRAD' 0,
        'opsz' 24
      }
    </style>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#8b5cf6",
              "background-light": "#f6f7f8",
              "background-dark": "#18181b",
            },
            fontFamily: {
              "display": ["Manrope", "sans-serif"],
              "timer": ["Kumbh Sans", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
</head>
<body class="font-display bg-background-light dark:bg-background-dark">
<div class="relative flex h-screen min-h-screen w-full flex-col">
<div class="flex flex-1 justify-center p-5 sm:p-8 md:p-10">
<div class="flex w-full max-w-4xl flex-col">
<header class="flex items-center justify-between whitespace-nowrap px-4 py-3">
<div class="flex items-center gap-3 text-white">
<div class="size-6 text-primary">
<svg fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M12 2C6.486 2 2 6.486 2 12s4.486 10 10 10 10-4.486 10-10S17.514 2 12 2Zm0 18c-4.411 0-8-3.589-8-8s3.589-8 8-8 8 3.589 8 8-3.589 8-8 8Z"></path>
<path d="M13 7h-2v5.414l3.293 3.293 1.414-1.414L13 11.586V7Z"></path>
</svg>
</div>
<h2 class="text-slate-200 dark:text-slate-200 text-lg font-bold tracking-tight">Lofi Pomodoro</h2>
</div>
<button id="settings-btn" class="flex h-10 w-10 cursor-pointer items-center justify-center rounded-lg bg-white/10 text-slate-200 transition-colors hover:bg-white/20">
<span class="material-symbols-outlined text-2xl">
              settings
            </span>
</button>
</header>
<main class="flex flex-1 flex-col items-center justify-center text-center">
<div class="relative my-8 flex h-[28vw] w-[28vw] max-h-[400px] min-h-[300px] min-w-[300px] max-w-[400px] items-center justify-center">
<svg class="absolute inset-0" viewBox="0 0 120 120">
<circle class="text-slate-200/10" cx="60" cy="60" fill="transparent" r="54" stroke="currentColor" stroke-width="12"></circle>
<circle id="progress-circle" class="-rotate-90 origin-center transform text-primary" cx="60" cy="60" fill="transparent" r="54" stroke="currentColor" stroke-dasharray="339.292" stroke-dashoffset="0" stroke-linecap="round" stroke-width="12" style="transition: stroke-dashoffset 1s linear;"></circle>
</svg>
<div class="z-10 flex flex-col items-center">
<p id="timer-display" class="font-timer text-[clamp(3.5rem,6vw,5rem)] font-light leading-none text-slate-100 tabular-nums tracking-wide">25:00</p>
</div>
</div>
<div class="mt-8 flex flex-col items-center gap-6">
<div class="flex items-center gap-4">
<div class="h-12 w-12"></div>
<button id="toggle-btn" class="flex h-16 w-16 items-center justify-center rounded-full bg-primary text-white shadow-lg shadow-primary/30 transition-transform hover:scale-105">
<span id="toggle-icon" class="material-symbols-outlined text-4xl">
                  play_arrow
                </span>
</button>
<button id="skip-btn" class="flex h-12 w-12 items-center justify-center rounded-full bg-slate-500/20 text-slate-300 transition-colors hover:bg-white/20">
<span class="material-symbols-outlined text-3xl">
                  skip_next
                </span>
</button>
</div>
</div>
</main>
<footer class="w-full max-w-md self-center p-4">
<div class="text-center">
<p id="status-text" class="text-base font-semibold text-slate-100 dark:text-slate-100">Focus Time</p>
<p id="session-text" class="mt-1 text-sm font-medium text-slate-300 dark:text-slate-300">Session 1 of 4</p>
</div>
</footer>
</div>
</div>
</div>

<audio id="audio-player" loop crossorigin="anonymous">
  <source src="https://stream.zeno.fm/0r0xa792kwzuv" type="audio/mpeg">
  Your browser does not support the audio element.
</audio>

<script>
  // Timer State
  const state = {
    timeLeft: 25 * 60,
    totalTime: 25 * 60,
    isRunning: false,
    mode: 'focus', // focus, shortBreak, longBreak
    sessionCount: 1,
    totalSessions: 4,
    timerId: null
  };

  // DOM Elements
  const timerDisplay = document.getElementById('timer-display');
  const progressCircle = document.getElementById('progress-circle');
  const toggleBtn = document.getElementById('toggle-btn');
  const toggleIcon = document.getElementById('toggle-icon');
  const skipBtn = document.getElementById('skip-btn');
  const statusText = document.getElementById('status-text');
  const sessionText = document.getElementById('session-text');
  const audioPlayer = document.getElementById('audio-player');
  const settingsBtn = document.getElementById('settings-btn');

  // Constants
  const MODES = {
    focus: { time: 25 * 60, label: 'Focus Time' },
    shortBreak: { time: 5 * 60, label: 'Short Break' },
    longBreak: { time: 15 * 60, label: 'Long Break' }
  };

  const CIRCUMFERENCE = 339.292;

  // Initialize
  function init() {
    updateDisplay();
    setupEventListeners();
  }

  function setupEventListeners() {
    toggleBtn.addEventListener('click', toggleTimer);
    skipBtn.addEventListener('click', skipSession);
    settingsBtn.addEventListener('click', () => {
        // Simple settings functionality: cycle through modes manually for demo
        // Ideally this would open a modal
        alert('This simple setting button cycles timer duration for testing.\nAdjusting to next mode...');
        skipSession();
    });
  }

  function toggleTimer() {
    if (state.isRunning) {
      pauseTimer();
    } else {
      startTimer();
    }
  }

  function startTimer() {
    state.isRunning = true;
    toggleIcon.textContent = 'pause';

    // Play Audio
    audioPlayer.play().catch(e => console.log('Audio playback failed (interaction needed):', e));

    state.timerId = setInterval(() => {
      if (state.timeLeft > 0) {
        state.timeLeft--;
        updateDisplay();
      } else {
        completeSession();
      }
    }, 1000);
  }

  function pauseTimer() {
    state.isRunning = false;
    toggleIcon.textContent = 'play_arrow';
    clearInterval(state.timerId);

    // Pause Audio
    audioPlayer.pause();
  }

  function completeSession() {
    pauseTimer();
    // Play a notification sound or just transition?
    // For now, auto-transition logic or wait for user?
    // Standard pomodoro usually waits or notifies.
    // Let's just switch mode automatically but keep paused.

    if (state.mode === 'focus') {
      if (state.sessionCount % 4 === 0) {
        switchMode('longBreak');
      } else {
        switchMode('shortBreak');
      }
      // If we want to auto-increment session only after focus
      // But typically session count is "Pomodoros completed"
      // Current text says "Session X of 4".
    } else {
      // Break is over
      if (state.mode === 'longBreak') {
        state.sessionCount = 1; // Reset or continue? Usually reset cycle.
      } else {
        state.sessionCount++;
      }
      switchMode('focus');
    }

    // Play a chime if possible (not included in audio tag, but visual update is there)
    alert('Timer Complete!');
  }

  function skipSession() {
    pauseTimer(); // Stop current
    completeSession(); // Move to next
  }

  function switchMode(newMode) {
    state.mode = newMode;
    state.totalTime = MODES[newMode].time;
    state.timeLeft = state.totalTime;
    updateDisplay();
  }

  function updateDisplay() {
    // Update Timer Text
    const minutes = Math.floor(state.timeLeft / 60);
    const seconds = state.timeLeft % 60;
    timerDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;

    // Update Circle Progress
    // stroke-dashoffset: 0 = full, CIRCUMFERENCE = empty.
    // We want it to decrease as time goes on? Or fill up?
    // Usually timers count down, so the bar shrinks.
    // Shrinking: Full at start (offset 0), Empty at end (offset CIRCUMFERENCE).
    const progress = state.timeLeft / state.totalTime;
    const offset = CIRCUMFERENCE - (progress * CIRCUMFERENCE);
    progressCircle.style.strokeDashoffset = offset;

    // Update Status Text
    statusText.textContent = MODES[state.mode].label;

    // Update Session Text
    if (state.mode === 'focus') {
       sessionText.textContent = `Session ${state.sessionCount} of ${state.totalSessions}`;
    } else {
       sessionText.textContent = 'Take a break';
    }
  }

  init();
</script>
</body></html>
